[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-calculator"
version = "2.0.0"
description = "Calcolatrice scientifica CLI con algebra simbolica, matrici e grafici"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "sympy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
sci-calculator = "sci_calculator.cli:main"

[tool.setuptools.packages.find]
include = ["sci_calculator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
