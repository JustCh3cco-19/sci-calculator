[metadata]
name = sci-calculator
version = 2.0.0
description = Calcolatrice scientifica CLI con algebra simbolica, matrici e grafici
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.10
install_requires =
    matplotlib>=3.7,<4
    numpy>=1.24,<3
    sympy>=1.12,<2

[options.packages.find]
include = sci_calculator*

[options.entry_points]
console_scripts =
    sci-calculator = sci_calculator.cli:main

[options.extras_require]
dev =
    pytest>=8,<9
    ruff>=0.6,<1
